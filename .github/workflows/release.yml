name: Build Release Files

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

          if (Test-Path requirements.txt) {
            pip install -r requirements.txt
          }

      - name: Build EXE
        shell: pwsh
        run: |
          pyinstaller `
            --onefile `
            --console `
            --name "MTS-CoinSort" `
            MTS_Coin_Sort.py

      - name: Upload Windows EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MTS-CoinSort.exe

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget

          python -m pip install --upgrade pip
          pip install pyinstaller

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Build Linux Binary
        run: |
          pyinstaller \
            --onefile \
            --console \
            --name MTS-CoinSort \
            MTS_Coin_Sort.py

      - name: Create AppDir
        run: |
          mkdir -p AppDir/usr/bin

          cp dist/MTS-CoinSort AppDir/usr/bin/MTS-CoinSort

          cat > AppDir/MTS-CoinSort.desktop <<EOF
[Desktop Entry]
Type=Application
Name=MTS CoinSort
Exec=MTS-CoinSort
Terminal=true
Categories=Utility;
EOF

      - name: Build AppImage
        run: |
          wget -O appimagetool \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage

          chmod +x appimagetool

          ARCH=x86_64 ./appimagetool AppDir MTS-CoinSort-x86_64.AppImage

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          files: MTS-CoinSort-x86_64.AppImage